name: Build TCEDC Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - feat/tcedc-field-route-android
    paths:
      - 'apps/tcedc-field-route-android/**'
      - '.github/workflows/build-tcedc-android.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/tcedc-field-route-android/**'
      - '.github/workflows/build-tcedc-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Decode Android project
        run: |
          mkdir -p build/tcedc
          base64 --decode apps/tcedc-field-route-android/project.zip.b64 > build/tcedc/project.zip
          unzip -q build/tcedc/project.zip -d build/tcedc

      - name: Build debug APK
        working-directory: build/tcedc/TCEDC_Field_Route
        run: gradle --no-daemon clean assembleDebug

      - name: Verify APK
        run: |
          test -f build/tcedc/TCEDC_Field_Route/app/build/outputs/apk/debug/app-debug.apk
          ls -lh build/tcedc/TCEDC_Field_Route/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TCEDC-Field-Route-debug-apk
          path: build/tcedc/TCEDC_Field_Route/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
